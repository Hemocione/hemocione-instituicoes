<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hemocione Instituições</title>
  </head>
  <body>
    <div id="app">
      <div id="app-loading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f8f8;">
        <div style="width:36px;height:36px;border-radius:50%;border:3px solid #e8e8e8;border-top-color:#bb0a08;animation:app-loading-spin 0.8s linear infinite;"></div>
        <span style="font-size:14px;color:#52575c;">Carregando hemocione instituições…</span>
      </div>
    </div>
    <style>
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
